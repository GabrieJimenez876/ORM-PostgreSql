<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Registro y consulta de egresos">
    <title>{% block title %}Gestor de egresos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Navegación principal">
        <a class="brand" href="{{ url_for('web.inicio') }}">Gestor de egresos</a>
        <div class="nav-links">
          <a href="{{ url_for('web.inicio') }}">Inicio</a>
          <a href="{{ url_for('web.crear_egreso') }}">Nuevo egreso</a>
          <a href="{{ url_for('web.buscar_egreso') }}">Buscar</a>
        </div>
      </nav>
    </header>
    <main class="container main-content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="alerts" aria-live="polite">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container">Gestor de egresos · PostgreSQL</div>
    </footer>
  </body>
</html>
