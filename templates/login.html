{% extends "base.html" %}
{% block title %}Iniciar sesión · Gestor de egresos{% endblock %}
{% block content %}
  <section class="auth-card">
    <p class="eyebrow">Tu espacio privado</p>
    <h1>Iniciar sesión</h1>
    <p class="muted">Ingresa a tu cuenta para administrar tus egresos.</p>
    {% if error %}
      <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="32" autocomplete="username" required value="{{ username }}">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="button button-primary" type="submit">Iniciar sesión</button>
    </form>
    <p class="auth-switch">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Crea una cuenta</a></p>
  </section>
{% endblock %}
